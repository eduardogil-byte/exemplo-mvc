name: aula-mvc
services:
  web:
    build: .
    image: aula-mvc:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Aluno: ${ALUNO:-Minha turma}
      TrustedProxy: ${TRUSTED_PROXY:?Configure TRUSTED_PROXY no arquivo .env}
    networks:
      - aula
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  aula:
    external: true
    name: aula-net
